*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

const dihedralDeg = (p0, p1, p2, p3) => {
const b0x=p0[0]-p1[0],b0y=p0[1]-p1[1],b0z=p0[2]-p1[2];
const b1x=p2[0]-p1[0],b1y=p2[1]-p1[1],b1z=p2[2]-p1[2];
const b2x=p3[0]-p2[0],b2y=p3[1]-p2[1],b2z=p3[2]-p2[2];
const b1n=Math.hypot(b1x,b1y,b1z); if(b1n<1e-5) return null;
const u1x=b1x/b1n,u1y=b1y/b1n,u1z=b1z/b1n;
const d0=b0x*u1x+b0y*u1y+b0z*u1z, d2=b2x*u1x+b2y*u1y+b2z*u1z;
const vx=b0x-d0*u1x,vy=b0y-d0*u1y,vz=b0z-d0*u1z;
const wx=b2x-d2*u1x,wy=b2y-d2*u1y,wz=b2z-d2*u1z;
const x=vx*wx+vy*wy+vz*wz;
const cx=u1y*vz-u1z*vy,cy=u1z*vx-u1x*vz,cz=u1x*vy-u1y*vx;
return Math.atan2(cx*wx+cy*wy+cz*wz, x)*57.2957795;
};
const getDM = ch => {
if(S.dmCache.has(ch)) return S.dmCache.get(ch);
const L=ch.n, c=ch.ca, dm=new Float32Array(L*L);
for(let i=0;i<L;i++){
const ix=c[i*3],iy=c[i*3+1],iz=c[i*3+2];
for(let j=i+1;j<L;j++){
const d=Math.hypot(ix-c[j*3],iy-c[j*3+1],iz-c[j*3+2]);
dm[i*L+j]=d; dm[j*L+i]=d;
}
}
S.dmCache.set(ch,dm); return dm;
};

const g=getFunnelGrid(N), Z=new Array(N);
const shH=Math.max(0,m.ts-m.u)*0.15, du=m.u-m.n, minGap=0.15*Math.max(2,Math.abs(du));
for(let iy=0;iy<N;iy++){
const row=new Array(N), base=iy*N;
for(let ix=0;ix<N;ix++){
const idx=base+ix; if(g.out[idx]){ row[ix]=null; continue; }
let z=m.n+du*g.rPow[idx]+shH*g.sh[idx];
if(type==="rugged"){
const zr=z+rough*g.rug[idx], fl=m.n-g.f1[idx]+minGap*g.f2[idx];
z=Math.max(zr,fl)+Math.log1p(Math.exp(-5*Math.abs(zr-fl)))/5;
} else if(type==="multi") z+=depth*g.mul[idx];
row[ix]=+z.toFixed(2);
}
Z[iy]=row;
}
const tr={type:"surface",x:g.ax,y:g.ax,z:Z,colorscale:"Viridis",colorbar:{title:"kJ/mol"},connectgaps:false};
if(zRange){ tr.cmin=zRange[0]; tr.cmax=zRange[1]; }
return tr;
};

const getProteinRamaGrid = (ch) => {

    }

const loadFastaText = raw => {
const lines=(raw||"").trim().split(/\r?\n/);
let name="Custom_FASTA", seq="";
for(const ln of lines){
const s=ln.trim(); if(!s) continue;
if(s.startsWith(">")){ if(!seq) name=s.slice(1).split(/\s+/)[0]||name; else break; }
else seq+=s.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g,"");
}
if(seq.length<5){ toast(L("請貼上至少 5 個有效胺基酸字元","Paste at least 5 valid amino acid characters")); return; }
const n=seq.length, rnums=new Int32Array(n); for(let i=0;i<n;i++) rnums[i]=i+1;
S.bundle={sourceName:name, rawPdb:"", hasSidechains:false, seqOnly:true, chains:[{
model:0, chain:"A", n, sequence:seq, ca:new Float32Array(0), cb:new Float32Array(0),
resNums:rnums, resNames:Array.from(seq), ss:"C".repeat(n),
sgNums:new Int32Array(0), sg:new Float32Array(0),
rama:{phi:new Float32Array(0),psi:new Float32Array(0),nums:new Int32Array(0),names:[],aa:""}
}]};
S.title=`${name} (FASTA)`; S.chainIdx=0; S.mutRes=1; S.pipe.mutations=[]; saveState();
if(S.tab==="3d"||S.tab==="cm"||S.tab==="rama") S.tab="fasta";
$("srcStatus").textContent=`✓ ${name} (${n} aa, ${L("純序列","seq-only")})`;
renderHeader(); renderTab(); toast(L(`已載入純序列 ${name} (${n} aa)`,`Loaded sequence ${name} (${n} aa)`));
};

if(qPdb){ $("rcsbId").value=qPdb.toUpperCase(); fetchRCSB(qPdb); }
else if(qAfdb){ $("afdbId").value=qAfdb.toUpperCase(); fetchAFDB(qAfdb); }
else loadBundle($("sample1ubq").textContent,"1UBQ (Ubiquitin)",true);
});
// @ux: Vision Pro specular card sheen + click-to-copy sequences + Spotlight Command Palette (Ctrl+K)
document.addEventListener("pointermove", e => {
  const c = e.target.closest?.(".card"); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX - r.left) + "px");
  c.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });
document.addEventListener("click", async e => {
  const pre = e.target.closest?.("pre.seq"); if (!pre) return;
  try { await navigator.clipboard.writeText(pre.textContent.trim()); toast(L("✓ 已複製序列至剪貼簿","✓ Sequence copied to clipboard")); } catch (_) {}
});
const cmdItems = () => [
  ...I18N[S.lang].nav.map(([k, l]) => ({ t: l, k: L("模組","Module"), fn: () => { S.tab = k; renderHeader(); renderTab(); } })),
  { t: L("🌐 載入 RCSB 1CRN (Crambin)","🌐 Fetch RCSB 1CRN (Crambin)"), k: "RCSB", fn: () => fetchRCSB("1CRN") },
  { t: L("🌐 載入 RCSB 1UBQ (真實晶體 Ubiquitin)","🌐 Fetch RCSB 1UBQ (Crystal Ubiquitin)"), k: "RCSB", fn: () => fetchRCSB("1UBQ") },
  { t: L("🌐 載入 RCSB 4HHB (Hemoglobin)","🌐 Fetch RCSB 4HHB (Hemoglobin)"), k: "RCSB", fn: () => fetchRCSB("4HHB") },
  { t: L("🤖 載入 AlphaFold P04637 (TP53)","🤖 Fetch AlphaFold P04637 (TP53)"), k: "AFDB", fn: () => fetchAFDB("P04637") },
  { t: L("🤖 載入 AlphaFold P69905 (HBA1)","🤖 Fetch AlphaFold P69905 (HBA1)"), k: "AFDB", fn: () => fetchAFDB("P69905") },
  { t: L("☀️ / 🌇 / 🌙 切換 早上 / 午後 / 夜晚 主題","☀️ / 🌇 / 🌙 Cycle Morning / Afternoon / Night Theme"), k: L("外觀","Theme"), fn: () => { const cur = S.theme === "pride" ? lastStdTheme : S.theme; applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]); saveState(); } },
  { t: L("🏳️‍🌈 切換 Pride 彩蛋模式","🏳️‍🌈 Toggle Pride Easter Egg"), k: L("彩蛋","Easter Egg"), fn: () => { applyTheme(S.theme === "pride" ? lastStdTheme : "pride"); saveState(); } },
  { t: L("📖 切換實驗室手冊顯示","📖 Toggle Lab Handbook"), k: L("手冊","Handbook"), fn: () => { S.handbook = !S.handbook; saveState(); renderHeader(); renderTab(); } }
];
let cmdIdx = 0, cmdFiltered = [];
const renderCmd = () => {
  const raw = ($("cmdIn").value || "").trim();
  const q = raw.toLowerCase();
  cmdFiltered = cmdItems().filter(x => x.t.toLowerCase().includes(q) || x.k.toLowerCase().includes(q));
  if (/^[a-z0-9]{4}$/i.test(raw)) {
    const pid = raw.toUpperCase();
    cmdFiltered.unshift({ t: L(`🌐 從 RCSB 下載結構 ${pid}`,`🌐 Fetch RCSB Structure ${pid}`), k: L("即時抓取","Fetch"), fn: () => { $("rcsbId").value = pid; fetchRCSB(pid); } });
  }
  cmdIdx = Math.min(cmdIdx, Math.max(0, cmdFiltered.length - 1));
  $("cmdList").innerHTML = cmdFiltered.map((x, i) => `<div class="cmd-item ${i===cmdIdx?"sel":""}" data-i="${i}"><span>${x.t}</span><span class="k">${x.k}</span></div>`).join("") || `<div style="padding:14px;color:var(--mu);text-align:center">${L("查無符合指令","No matching commands")}</div>`;
  $("cmdList").querySelectorAll(".cmd-item").forEach(el => el.onclick = () => { closeCmd(); cmdFiltered[+el.dataset.i]?.fn(); });
};
const openCmd = () => { $("cmdModal").classList.add("open"); $("cmdIn").value = ""; cmdIdx = 0; renderCmd(); setTimeout(() => $("cmdIn").focus(), 20); };
const closeCmd = () => $("cmdModal").classList.remove("open");
$("btnCmd").onclick = openCmd;
$("cmdModal").onclick = e => { if (e.target === $("cmdModal")) closeCmd(); };
$("cmdIn").oninput = () => { cmdIdx = 0; renderCmd(); };
$("cmdIn").onkeydown = e => {
  if (e.key === "ArrowDown") { e.preventDefault(); cmdIdx = (cmdIdx + 1) % Math.max(1, cmdFiltered.length); renderCmd(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); cmdIdx = (cmdIdx - 1 + Math.max(1, cmdFiltered.length)) % Math.max(1, cmdFiltered.length); renderCmd(); }
  else if (e.key === "Enter" && cmdFiltered[cmdIdx]) { e.preventDefault(); const fn = cmdFiltered[cmdIdx].fn; closeCmd(); fn(); }
  else if (e.key === "Escape") closeCmd();
};
window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("cmdModal").classList.contains("open") ? closeCmd() : openCmd(); } });
// @fx: ultra-lightweight 240x140 volumetric ambient orb shader (<2MB RAM, pauses when tab hidden)
(() => {
  const cv = $("ambient_bg"), ctx = cv?.getContext("2d"); if (!ctx) return;
  const W = 240, H = 140;
  const PAL = {
    light: ["rgba(0,113,227,0.22)", "rgba(56,189,248,0.18)", "rgba(99,102,241,0.14)"],
    sunlit: ["rgba(249,115,22,0.26)", "rgba(251,191,36,0.22)", "rgba(234,88,12,0.16)"],
    dark: ["rgba(41,151,255,0.28)", "rgba(191,90,242,0.22)", "rgba(48,209,88,0.12)"],
    pride: ["rgba(225,29,72,0.22)", "rgba(245,158,11,0.20)", "rgba(147,51,234,0.22)"]
  };
  const orbs = [{x:.75,y:.22,r:62,vx:.0005,vy:.0004,p:0},{x:.22,y:.78,r:58,vx:-.0004,vy:.0005,p:2.1},{x:.52,y:.48,r:52,vx:.0003,vy:-.0004,p:4.2}];
  let t = 0, last = 0;
  const tick = ts => {
    requestAnimationFrame(tick);
    if (document.hidden || ts - last < 45) return; // ~22fps smooth drift, near-zero CPU
    last = ts; t += 0.012;
    ctx.clearRect(0, 0, W, H);
    const cols = PAL[S.theme] || PAL.light;
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      const cx = (o.x + Math.sin(t + o.p) * 0.14) * W;
      const cy = (o.y + Math.cos(t * 0.85 + o.p) * 0.14) * H;
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, o.r);
      g.addColorStop(0, cols[i]); g.addColorStop(1, "transparent");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, 6.2832); ctx.fill();
    }
  };
  requestAnimationFrame(tick);
})();
})();
</script>
